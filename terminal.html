const norm = (s)=> (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/g,"");
const shortRef = (r)=>{ const [m,y]=r.split("/"); return m+"/"+y.slice(2); };
function fmtDate(iso){ const d=new Date(iso);
  const p=n=>String(n).padStart(2,"0");
  return p(d.getDate())+"/"+p(d.getMonth()+1)+"/"+d.getFullYear()+" "+p(d.getHours())+":"+p(d.getMinutes()); }

function triBig(v){
  if(v==null) return '<span class="flat">· —</span>';
  if(v>0) return '<span class="up">▲ +'+fmtBR(v)+'%</span>';
  if(v<0) return '<span class="down">▼ '+fmtBR(v)+'%</span>';
  return '<span class="flat">▬ '+fmtBR(v)+'%</span>';
}
function triSmall(v){
  if(v==null) return '<span class="flat">·</span>';
  const g=v>0?"▲":(v<0?"▼":"▬"), c=v>0?"up":(v<0?"down":"flat");
  return '<span class="mv '+c+'">'+g+fmtBR(Math.abs(v))+'</span>';
}
function monthsRow(points, key){
  let h='<div class="months">';
  for(const p of points){
    h+='<div class="mcell"><span class="ml">'+shortRef(p.ref)+'</span>'+triSmall(p[key])+'</div>';
  }
  return h+'</div>';
}
// variação m/m a partir de valores absolutos; só entre meses consecutivos (evita "m/m" enganoso)
function refIdx(ref){ const [m,y]=ref.split("/").map(Number); return y*12+(m-1); }
function withVar(serie, key){
  let prev=null, prevIdx=null; const r=[];
  for(const p of serie){
    const idx=refIdx(p.ref);
    const consecutive = prevIdx!=null && (idx-prevIdx===1);
    const v = (consecutive && prev!=null && p[key]!=null)?(p[key]/prev-1)*100:null;
    r.push(Object.assign({}, p, {var:v}));
    prev=p[key]; prevIdx=idx;
  }
  return r;
}
const withComputedVar = (serie)=> withVar(serie, "valor");
function acc12(serie){
  const s=serie;
  if(s.length>=13 && s[s.length-1].base100!=null && s[s.length-13].base100!=null)
    return (s[s.length-1].base100/s[s.length-13].base100-1)*100;
  const last12=s.slice(-12).map(p=>p.var).filter(v=>v!=null);
  if(!last12.length) return null;
  return (last12.reduce((a,v)=>a*(1+v/100),1)-1)*100;
}

/* ---------- renderers: fipezap cidades ---------- */
const fipeCidades = ()=> DATA.fipezap_cidades || [];
const fipeBairros = ()=> DATA.fipezap_bairros || [];
function findCity(q){
  const nq=norm(q); if(!nq) return null;
  const L=fipeCidades();
  return L.find(c=>norm(c.cidade)===nq)
      || L.filter(c=>nq.startsWith(norm(c.cidade))||norm(c.cidade).startsWith(nq))
           .sort((a,b)=>norm(b.cidade).length-norm(a.cidade).length)[0]
      || L.find(c=>norm(c.cidade).includes(nq)) || null;
}
function renderCidade(c){

  const last = serie[serie.length-1];
  const pts = serie.slice(-12);
  const rentab = (last.aluguel!=null && last.venda) ? last.aluguel/last.venda*100 : null;
  const fonte = c.fonte_url ? '<a href="'+c.fonte_url+'" target="_blank" rel="noopener">'+c.fonte_url+'</a>' : "—";

}

/* ---------- renderers: fipezap bairros ---------- */
const bairroCities = ()=> [...new Set(fipeBairros().map(b=>b.cidade))].sort((a,b)=>a.localeCompare(b));
function findBairro(q){
  const nq=norm(q); if(!nq) return {error:"informe cidade e bairro (ex: bairro brasilia sudoeste)"};
  const cities = bairroCities().sort((a,b)=>norm(b).length-norm(a).length);
  for(const city of cities){
    const nc=norm(city);
    if(nq.startsWith(nc)){
      const rest=nq.slice(nc.length);
      if(!rest) return {city, list:true};
      const inCity = fipeBairros().filter(x=>x.cidade===city);
      const b = inCity.find(x=>norm(x.bairro)===rest)
             || inCity.find(x=>norm(x.bairro).startsWith(rest))
             || inCity.find(x=>norm(x.bairro).includes(rest));
      if(b) return {bairro:b};
      return {city, list:true, miss:q};
    }
  }
  const hits = fipeBairros().filter(x=>norm(x.bairro)===nq);
  if(hits.length===1) return {bairro:hits[0]};
  return {error:"não encontrei '"+esc(q)+"'. tente: bairros <cidade>"};
}
function renderBairro(b){
  const serie = withVar(b.serie, "valor");
  const last = serie[serie.length-1];
  const pts = serie.slice(-12);
  const v12 = b.latest && b.latest.var12!=null ? b.latest.var12 : last.var12;
  const fonte = b.fonte_url ? '<a href="'+b.fonte_url+'" target="_blank" rel="noopener">'+b.fonte_url+'</a>' : "—";
  let h='<div class="block">';
  h+='<div><span class="hdr">'+esc(b.bairro)+'</span> <span class="nm">· '+esc(b.cidade)+' · FipeZAP venda R$/m²</span></div>';
  h+='<div class="big"><span class="v">'+fmtM2(last.valor)+'</span> '+triBig(v12)+' <span class="tag">12m</span></div>';
  h+='<div class="bigsub">ref '+last.ref+'</div>';
  if(pts.length>1){ h+='<div class="cap">'+pts.length+' meses (var % m/m)</div>'+monthsRow(pts,"var"); }
  h+='<div class="src">fonte '+fonte+' · atualizado '+fmtDate(DATA.generated_at)+'</div>';
  return h+'</div>';
}
function cmdBairros(cityQuery){
  if(!cityQuery){
    return '<div class="block"><div class="hdr">FipeZAP · bairros</div>'+
      '<div class="line nm">cidades com bairros: '+bairroCities().map(esc).join(" · ")+'</div>'+
      '<div class="src">use <b>bairros &lt;cidade&gt;</b> (ex: bairros recife)</div></div>';
  }
  const city = (findCity(cityQuery)||{}).cidade
            || bairroCities().find(c=>norm(c)===norm(cityQuery) || norm(c).startsWith(norm(cityQuery)));
  const list = fipeBairros().filter(b=>norm(b.cidade)===norm(city||cityQuery));
  if(!list.length) return errLine("sem bairros para '"+esc(cityQuery)+"'")+

  return '<div class="block"><div class="hdr">FipeZAP · bairros · '+esc(list[0].cidade)+' ('+list.length+')</div>'+
         '<table class="tb">'+rows+'</table>'+
         '<div class="src">detalhe: <b>bairro '+esc(list[0].cidade.toLowerCase())+' '+esc(list[0].bairro.toLowerCase())+'</b></div></div>';

function okBadge(ref, esperado){
  if(!ref) return '<span class="err">sem dados</span>';
  if(ref===esperado) return '<span class="ok">✓ '+esc(ref)+'</span>';
  const [m,y]=ref.split("/").map(Number), [em,ey]=esperado.split("/").map(Number);
  const ord=y*12+m, eord=ey*12+em;
  if(ord>=eord) return '<span class="ok">✓ '+esc(ref)+'</span>';
  return '<span class="err">✗ '+esc(ref)+' (esperado '+esc(esperado)+')</span>';
}

function cmdNovidades(){
  const m=fipeMeta();
  if(!m) return errLine("meta ausente — regenere: <b>python scripts/build_terminal.py</b>");
  let h='<div class="block"><div class="hdr">novidades · FipeZAP</div>';
  function monthDelta(label, recentes){
    if(!recentes||!recentes.length) return '';
    const latest=recentes[0], prev=recentes[1];
    let s='<div class="cap">'+label+'</div>';
    s+='<div class="kv">  mais recente   <b>'+esc(latest.ref)+'</b> ('+latest.n+(latest.cidades!=null?' · '+latest.cidades+' cidades':'')+' linhas)</div>';
    if(prev && latest.ref!==prev.ref){
      s+='<div class="kv ok">  novo mês       <b>'+esc(latest.ref)+'</b> (antes '+esc(prev.ref)+')</div>';
    } else if(prev){
      s+='<div class="kv">  sem mês novo   <span class="nm">ainda em '+esc(latest.ref)+'</span></div>';
    }
    return s;
  }
  h+=monthDelta('cidades', m.cidades.recentes);
  h+=monthDelta('bairros', m.bairros.recentes);
  if(m.runs && m.runs.length){
    h+='<div class="cap">última execução por pipeline</div>';
    const seen=new Set();
    for(const r of m.runs){
      if(seen.has(r.pipeline)) continue;
      seen.add(r.pipeline);
      const when=r.finalizado_em||r.iniciado_em;
      const tag = r.registros_coletados>0 ? '<span class="ok">gravou '+r.registros_coletados+'</span>'
                : '<span class="nm">0 novos (fonte ainda não saiu ou aba já existia)</span>';
      h+='<div class="kv">  '+esc(r.pipeline)+'  '+tag+' · '+esc(r.status)+' · '+(when?fmtDate(when):'—')+'</div>';
    }
  }
  h+='<div class="src">snapshot '+fmtDate(DATA.generated_at)+' · comando <b>fipezap-status</b> para detalhe</div>';
  return h+'</div>';
}

    '<div class="cap">Índices macro</div>'+
    '<div class="line">  ipca  inpc  igp-m  igp-di  incc  ivar    <span class="nm">(incc-m também vale)</span></div>'+
    '<div class="cap">CUB (R$/m² por UF)</div>'+
    '<div class="line">  cub              <span class="nm">lista todas as UFs</span></div>'+
    '<div class="line">  cub-sp  cub-rj   <span class="nm">uma UF (19 disponíveis)</span></div>'+
    '<div class="cap">FipeZAP (imóveis R$/m²)</div>'+
    '<div class="line">  fipezap          <span class="nm">visão geral</span></div>'+
    '<div class="line">  fipezap-status   <span class="nm">último mês no banco + cron</span></div>'+
    '<div class="line">  novidades        <span class="nm">mês novo / o que entrou</span></div>'+
    '<div class="line">  cidades          <span class="nm">lista cidades · detalhe: cidade são paulo</span></div>'+
    '<div class="line">  bairros &lt;cidade&gt;  <span class="nm">detalhe: bairro brasilia sudoeste</span></div>'+
    '<div class="cap">Análise</div>'+
    '<div class="line">  acumulado <ind>  <span class="nm">variação acumulada 12m</span></div>'+
    '<div class="line">  compare <a> <b>  <span class="nm">compara dois índices</span></div>'+
    '<div class="cap">Sistema</div>'+
    '<div class="line">  ls · status · clear   <span class="nm">↑/↓ histórico · tab autocompletar</span></div></div>';
}

/* ---------- dispatcher ---------- */
function run(raw){
  const parts = raw.trim().split(/\s+/);
  const cmd = (parts[0]||"").toLowerCase();
  const args = parts.slice(1);
  if(!cmd) return;
  if(cmd==="help"||cmd==="?"||cmd==="ajuda"){ print(cmdHelp()); return; }
  if(cmd==="clear"||cmd==="cls"||cmd==="limpar"){ clearScreen(); return; }
  if(cmd==="ls"||cmd==="list"||cmd==="lista"){ print(cmdLs()); return; }
  if(cmd==="status"){ print(cmdStatus()); return; }
  if(cmd==="acumulado"||cmd==="acum"||cmd==="12m"){ print(cmdAcumulado(args[0])); return; }
  if(cmd==="compare"||cmd==="comparar"||cmd==="vs"){ print(cmdCompare(args[0],args[1])); return; }
  // FipeZAP
  if(cmd==="fipezap"||cmd==="fipe-zap"){ print(cmdFipezapHome()); return; }
  if(cmd==="fipezap-status"||cmd==="fz-status"||cmd==="fipezap_status"){
    print(cmdFipezapStatus()); return;
  }
  if(cmd==="novidades"||cmd==="recentes"||cmd==="whats-new"){
    print(cmdNovidades()); return;
  }
  if(cmd==="cidades"){ print(cmdCidades()); return; }
  if(cmd==="cidade"||cmd==="fipezap-cidades"){
    if(!args.length){ print(cmd==="cidade"?errLine("uso: cidade <nome>  (ex: cidade são paulo)"):cmdCidades()); return; }
    const c=findCity(args.join(" ")); print(c?renderCidade(c):errLine("cidade não encontrada: "+esc(args.join(" "))+" — veja: cidades")); return;
  }
  if(cmd==="bairros"){ print(cmdBairros(args.join(" "))); return; }
  if(cmd==="bairro"||cmd==="fipezap-bairros"){
    if(!args.length){ print(cmdBairros("")); return; }
    const r=findBairro(args.join(" "));
    if(r.bairro){ print(renderBairro(r.bairro)); }
    else if(r.list){ print(cmdBairros(r.city)); }
    else { print(errLine(r.error||"bairro não encontrado")); }
    return;
  }
  // CUB
  if(cmd==="cub"){ print(args[0]?renderCub(args[0]):cmdCubOverview()); return; }
  if(cmd.startsWith("cub-")){ print(renderCub(cmd.slice(4))); return; }
  // macro
  if(ALIASES[cmd]){ print(renderMacro(ALIASES[cmd])); return; }
  print(errLine("comando não reconhecido: "+esc(cmd)+" — digite <b>help</b>"));
}

/* ---------- autocomplete ---------- */
const COMMANDS = ["help","clear","ls","list","status","acumulado","compare",
  "fipezap","fipezap-status","novidades","fipezap-cidades","fipezap-bairros","cidades","cidade","bairros","bairro"]
  .concat(Object.keys(ALIASES))
  .concat(["cub"]).concat(DATA.cub.map(c=>"cub-"+c.uf.toLowerCase()));
function autocomplete(){
  const v=input.value.trim().toLowerCase();
  if(!v) return;
  const hits=[...new Set(COMMANDS.filter(c=>c.startsWith(v)))];
  if(hits.length===1){ input.value=hits[0]+" "; }
  else if(hits.length>1){ echo(input.value); print('<div class="line nm">'+hits.join("   ")+'</div>'); scrollBottom(); }
}

/* ---------- input / history ---------- */
let history=[], hi=-1;
screen.addEventListener("mousedown", e=>{ if(e.target.tagName!=="A") input.focus(); });
function submit(v){ echo(v); if(v.trim()){ history.push(v.trim()); } hi=-1; run(v); scrollBottom(); }
input.addEventListener("keydown", e=>{
  if(e.key==="Enter"){ const v=input.value; input.value=""; submit(v); }
  else if(e.key==="ArrowUp"){ e.preventDefault();
    if(history.length){ hi = hi<0 ? history.length-1 : Math.max(0,hi-1); input.value=history[hi]; setTimeout(()=>input.setSelectionRange(input.value.length,input.value.length),0);} }
  else if(e.key==="ArrowDown"){ e.preventDefault();
    if(hi>=0){ hi++; if(hi>=history.length){ hi=-1; input.value=""; } else input.value=history[hi]; } }
  else if(e.key==="Tab"){ e.preventDefault(); autocomplete(); }
  else if(e.ctrlKey && e.key.toLowerCase()==="l"){ e.preventDefault(); clearScreen(); }
});

/* ---------- boot ---------- */
print('<div class="block banner">'+
  '<b>INDICADORES</b>  terminal de consulta\n\n'+
  '  snapshot    '+fmtDate(DATA.generated_at)+'\n'+
  '  fonte       '+esc(DATA.source)+'\n'+
  '  cobertura   '+DATA.macro.length+' macro · '+DATA.cub.length+' UFs (CUB) · '+
                   fipeCidades().length+' cidades + '+fipeBairros().length+' bairros (FipeZAP)\n\n'+
  '  digite <b style="color:#4ade80">help</b> para ver os comandos'+
  '</div>');
input.focus();
</script>
